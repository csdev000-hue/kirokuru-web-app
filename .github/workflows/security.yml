name: Security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run security:secrets
      - name: Install isolated test DB tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql libpq-dev
      - run: npm run test:security
      - run: npm run build
        env:
          AUTH_SECRET: phase11-build-canary-never-a-real-credential
          LIVEKIT_API_SECRET: phase11-livekit-canary-never-a-real-credential
      - run: npm run security:client
        env:
          AUTH_SECRET: phase11-build-canary-never-a-real-credential
          LIVEKIT_API_SECRET: phase11-livekit-canary-never-a-real-credential
