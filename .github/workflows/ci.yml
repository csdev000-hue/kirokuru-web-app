name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run infra:build
      - run: npm run test:infra
      - run: npm run infra:synth:fixture
      - name: Install PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql libpq-dev
      - run: npm run test:integration
      - run: npm run test:security
      - name: Check migration snapshot consistency
        run: |
          npm run db:generate
          test -z "$(git status --porcelain -- drizzle/migrations)"
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run security:client
