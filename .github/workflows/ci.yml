name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - name: Install PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql libpq-dev
      - run: npm run test:integration
      - name: Check migration snapshot consistency
        run: |
          npm run db:generate
          test -z "$(git status --porcelain -- drizzle/migrations)"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
